name: Deploy

# Runs after CI finishes, so only a commit with green checks reaches the site and the server.
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    build:
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: client/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4

    # The server: the Cloud Function of `firebase.json`, built and deployed by the Firebase CLI. Independent of the
    # Pages jobs, so a failure of one does not hold back the other. It signs in with the key of a service account
    # of the Firebase project, the repository secret `FIREBASE_SERVICE_ACCOUNT`.
    functions:
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
            - run: npx --yes firebase-tools@15.36.0 deploy --only functions --project tv-shows-explorer --non-interactive --force
