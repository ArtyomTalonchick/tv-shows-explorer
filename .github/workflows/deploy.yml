name: Deploy

# Runs after CI finishes, so only a commit with green checks reaches the site and the server.
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

permissions:
    contents: read

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    # The site and the server, both on Firebase (`firebase.json`): Hosting serves the client and hands `/api/**` to the
    # Cloud Function. The Firebase CLI builds both (the `predeploy` of each) and deploys them together, so the site
    # never calls a server older than itself. It signs in with the key of a service account of the Firebase project,
    # the repository secret `FIREBASE_SERVICE_ACCOUNT`.
    firebase:
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
            - run: npx --yes firebase-tools@15.36.0 deploy --only hosting,functions --project tv-shows-explorer --non-interactive --force
