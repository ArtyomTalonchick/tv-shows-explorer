<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premiere — v0.2 mockup: favourites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../library/components.css">
<link rel="icon" href="../icon/favicon-32.png" sizes="32x32">
<script src="../library/library.js"></script>
<!--
  v0.2: favourites on top of the search screen of v0.1 - a bookmark on every card, a toast after each change,
  the favourites button with its counter, and the favourites list in a drawer. Components come from
  ../library/components.css only; the styles below are page layout (screens, header, hero, grid) and the captions.
  Open through a local server: npx http-server design, then /v0.2/mockup.html
  Each state is a .screen with an id: start, results, added, removed, favourites, favourites-empty.
  The states of v0.1 (idle, loading, genre, empty, error) do not change, except for the favourites button in the header.
-->
<style>
  .caption { max-width: var(--sizes-content); margin: 0 auto; padding: var(--spacing-12) var(--spacing-12) var(--spacing-4); color: var(--colors-fg-subtle); font-size: var(--fontSizes-xs); letter-spacing: var(--letterSpacings-eyebrow); text-transform: uppercase; }
  .caption b { color: var(--colors-fg); }
  .screen { position: relative; display: flex; flex-direction: column; min-height: 100svh; overflow: hidden; border-top: 1px solid var(--colors-border); border-bottom: 1px solid var(--colors-border); background: var(--colors-bg); }
  .container { max-width: var(--sizes-content); margin: 0 auto; padding: 0 var(--spacing-12); }
  /* In the app the drawer and the toast are fixed to the viewport; here, to their screen. */
  .screen .drawer-layer, .screen .toast-region { position: absolute; }

  /* Start: the hero of v0.1, with the favourites button in the top-right corner */
  .hero { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: var(--spacing-30) var(--spacing-6) var(--spacing-24); }
  .hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 50% at 50% 55%, var(--colors-accent-glow), transparent 70%); }
  .hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 70% at 50% 50%, transparent, var(--colors-bg) 85%); }
  .wall { position: absolute; inset: calc(var(--spacing-10) * -1); display: grid; grid-template-columns: repeat(8, 1fr); gap: var(--spacing-3); opacity: .14; filter: grayscale(.6) blur(2px); transform: rotate(-6deg) scale(1.15); }
  .wall img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: var(--radii-sm); }
  .hero-inner { position: relative; z-index: 2; max-width: var(--sizes-hero); display: grid; justify-items: center; }
  .hero .display { margin: var(--spacing-6) 0; }
  .hero .lead { max-width: var(--sizes-prose); margin-bottom: var(--spacing-10); }
  .hero-top { position: absolute; top: var(--spacing-6); left: 0; right: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--spacing-12); }

  /* With a query: a compact header (logo, search, favourites), then the list */
  .bar { position: sticky; top: 0; z-index: 3; border-bottom: 1px solid var(--colors-border); background: var(--colors-bg-glass); backdrop-filter: blur(var(--blurs-glass)); }
  .bar .container { display: flex; align-items: center; gap: var(--spacing-6); padding-top: var(--spacing-4); padding-bottom: var(--spacing-4); }
  .bar .search-input { margin-left: auto; }
  .list { flex: 1; display: flex; flex-direction: column; width: 100%; padding-top: var(--spacing-12); padding-bottom: var(--spacing-16); }
  .head { display: flex; justify-content: space-between; align-items: end; gap: var(--spacing-4); flex-wrap: wrap; margin-bottom: var(--spacing-8); }
  .head .title { margin-top: var(--spacing-3); }
  .count { color: var(--colors-fg-muted); }
  .head + .chips { margin-bottom: var(--spacing-10); }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--spacing-8); margin-bottom: var(--spacing-12); }

  @media (max-width: 760px) {
    .caption { padding: var(--spacing-10) var(--spacing-4) var(--spacing-4); }
    .container { padding: 0 var(--spacing-4); }
    .hero-top { padding: 0 var(--spacing-4); }
    .wall { grid-template-columns: repeat(4, 1fr); }
    .hero .lead { font-size: var(--fontSizes-lg); }
    /* Logo and favourites on the first row, the search field full width below */
    .bar .container { flex-wrap: wrap; gap: var(--spacing-3); }
    .bar .fav-button { margin-left: auto; }
    .bar .search-input { order: 3; margin-left: 0; max-width: none; }
    .list { padding-top: var(--spacing-8); padding-bottom: var(--spacing-10); }
    .head { margin-bottom: var(--spacing-6); }
    .head + .chips { flex-wrap: nowrap; overflow-x: auto; margin: 0 calc(var(--spacing-4) * -1) var(--spacing-8); padding: 0 var(--spacing-4); scrollbar-width: none; }
    .grid { grid-template-columns: minmax(0, 1fr); gap: var(--spacing-8); }
    .grid .show-card { display: grid; grid-template-columns: var(--sizes-thumb) minmax(0, 1fr); column-gap: var(--spacing-4); align-items: center; padding-right: var(--spacing-12); }
    .grid .show-card__poster { grid-row: span 2; }
    .grid .show-card__name { margin-top: 0; align-self: end; white-space: normal; }
    .grid .show-card__meta { align-self: start; white-space: normal; }
    /* In the one-column list the bookmark sits at the right end of the row, away from the rating */
    .grid .show-card-wrap > .fav-toggle { top: calc(50% - var(--spacing-10) / 2); right: 0; }
  }
</style>
</head>
<body class="tokens-pending">
<main id="app"></main>

<script>
  const P = (a, b) => `https://static.tvmaze.com/uploads/images/medium_portrait/${a}/${b}.jpg`;
  const SHOWS = [
    { name: "Breaking Bad", genres: ["Drama", "Crime", "Thriller"], rating: 9.2, years: "2008–2019", poster: P(501, 1253519) },
    { name: "Dark", genres: ["Drama", "Science-Fiction"], rating: 8.2, years: "2017–2020", poster: P(504, 1262352) },
    { name: "Darkroom", genres: ["Documentary"], rating: null, years: "2019", poster: null }, // made up: no poster, no rating
    { name: "Severance", genres: ["Drama", "Science-Fiction"], rating: 7.7, years: "2022–", poster: P(548, 1371406) },
    { name: "Mr. Robot", genres: ["Drama", "Crime"], rating: 8.3, years: "2015–2019", poster: P(211, 528026) },
    { name: "True Detective", genres: ["Drama", "Crime"], rating: 8.1, years: "2014–", poster: P(490, 1226764) },
    { name: "The Last of Us", genres: ["Drama", "Action"], rating: 7.9, years: "2023–", poster: P(563, 1409008) },
    { name: "The Bear", genres: ["Drama", "Comedy"], rating: 7.3, years: "2022–2026", poster: P(629, 1574642) },
    { name: "Dune: Prophecy", genres: ["Drama", "Science-Fiction"], rating: 7.2, years: "2024–", poster: P(543, 1358056) },
  ];
  const PER_PAGE = 3;
  const byName = (name) => SHOWS.find((s) => s.name === name);
  const icon = (id) => `<svg class="icon"><use href="#${id}"/></svg>`;

  // Components: the markup of ../library/index.html, filled with data.
  const logo = () => `<a class="logo" href="#" aria-label="tv/explorer — back to start">tv<span>/</span>explorer</a>`;
  const search = ({ value = "", small = false } = {}) => `
    <label class="search-input ${small ? "search-input--sm" : ""}">${icon("search")}
      <input aria-label="Search shows" placeholder="Search shows, e.g. Dark" value="${value}">
      ${value ? `<button class="search-input__clear" aria-label="Clear search">${icon("close")}</button>` : ""}
    </label>`;
  const favButton = (n) => `
    <button class="fav-button" aria-haspopup="dialog">${icon("bookmark")}<span class="fav-button__label">Favourites</span>
      <span class="fav-button__count ${n === 0 ? "fav-button__count--zero" : ""}">${n}</span></button>`;
  const toggle = (s, on, plain = false) => `
    <button class="fav-toggle ${plain ? "fav-toggle--plain" : ""}" aria-pressed="${on}"
      aria-label="${on ? `Remove ${s.name} from favourites` : `Add ${s.name} to favourites`}">${icon("bookmark")}</button>`;
  const card = (s, favs) => `
    <div class="show-card-wrap">
      <a class="show-card" href="#">
        <div class="show-card__poster">${s.poster ? `<img src="${s.poster}" alt="${s.name} poster">`
          : `<div class="show-card__no-poster">${icon("film")}No poster</div>`}
          ${s.rating ? `<span class="show-card__rating">★ ${s.rating}</span>` : ""}</div>
        <h3 class="show-card__name">${s.name}</h3>
        <p class="show-card__meta">${s.years} · ${s.genres.join(", ")}</p>
      </a>${toggle(s, favs.includes(s.name))}
    </div>`;
  const chips = () => {
    const counts = {};
    SHOWS.forEach((s) => s.genres.forEach((g) => (counts[g] = (counts[g] || 0) + 1)));
    const genres = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
    const chip = (label, n, on) => `<button class="chip" aria-pressed="${on}">${label} <span class="chip__count">${n}</span></button>`;
    return `<div class="chips" role="group" aria-label="Genre">${chip("All", SHOWS.length, true)}${genres.map((g) => chip(g, counts[g], false)).join("")}</div>`;
  };
  const pagination = () => `<nav class="pagination" aria-label="Pages">
      <button class="pagination__item" aria-label="Previous page" disabled>${icon("chevron-left")}</button>
      <button class="pagination__item" aria-current="page">1</button><button class="pagination__item">2</button><button class="pagination__item">3</button>
      <button class="pagination__item" aria-label="Next page">${icon("chevron-right")}</button>
    </nav><p class="pagination__info">Shows 1–3 of ${SHOWS.length}</p>`;
  const toast = (s, added) => `
    <div class="toast-region"><div class="toast ${added ? "toast--added" : ""}" role="status">${icon("bookmark")}
      <p class="toast__text">${added ? `Added <b>${s.name}</b> to favourites` : `Removed <b>${s.name}</b> from favourites`}</p>
      ${added ? "" : `<button class="toast__action">Undo</button>`}</div></div>`;
  const row = (s) => `
    <li class="fav-row"><a class="fav-row__link" href="#">
      <span class="fav-row__thumb">${s.poster ? `<img src="${s.poster}" alt="">` : icon("film")}</span>
      <span class="fav-row__text"><span class="fav-row__name">${s.name}</span><span class="fav-row__meta">${s.years} · ${s.genres.join(", ")}</span></span>
    </a>${toggle(s, true, true)}</li>`;
  const drawer = (favs) => `
    <div class="drawer-layer"><aside class="drawer" role="dialog" aria-modal="true" aria-label="Favourites">
      <header class="drawer__header"><div><div class="eyebrow">Your list</div>
        <h2 class="drawer__title">Favourites <span class="drawer__count">${favs.length}</span></h2></div>
        <button class="drawer__close" aria-label="Close favourites">${icon("close")}</button></header>
      <div class="drawer__body">${favs.length
        ? `<ul class="fav-list">${favs.map((n) => row(byName(n))).join("")}</ul>`
        : `<div class="state"><div class="state__icon">${icon("bookmark")}</div><h3 class="state__title">No favourites yet</h3>
            <p class="state__text">Tap the bookmark on a show to keep it here.</p></div>`}</div>
    </aside></div>`;

  // Page layout
  const results = (favs, overlay = "") => `
    <header class="bar"><div class="container">${logo()}${search({ value: "dark", small: true })}${favButton(favs.length)}</div></header>
    <section class="list container">
      <div class="head"><div><div class="eyebrow">Results</div><h2 class="title">Shows for <em>“dark”</em></h2></div><div class="count">${SHOWS.length} shows</div></div>
      ${chips()}
      <div class="grid">${SHOWS.slice(0, PER_PAGE).map((s) => card(s, favs)).join("")}</div>
      ${pagination()}
    </section>${overlay}`;

  // The newest favourite comes first in the list.
  const SAVED = ["Breaking Bad", "Severance"];
  const WITH_DARK = ["Dark", ...SAVED];
  const SCREENS = [
    ["start", "Start — the favourites button in the top-right corner, opposite the logo; the counter shows 0 too", `
      <section class="hero" aria-label="Search">
        <div class="hero-top">${logo()}${favButton(0)}</div>
        <div class="wall" aria-hidden="true">${Array(4).fill(SHOWS.filter((s) => s.poster).map((s) => `<img src="${s.poster}" alt="">`).join("")).join("")}</div>
        <div class="hero-inner">
          <div class="eyebrow">TVmaze · 80 000+ shows</div>
          <h1 class="display">Find your next obsession.</h1>
          <p class="lead">Search any show, see its rating and genres — in one dark, quiet place.</p>
          ${search()}
        </div>
      </section>`],
    ["results", "Results — a bookmark on every card: filled for a favourite (Breaking Bad), empty for the rest; 2 in the header", results(SAVED)],
    ["added", "Added — a tap on the bookmark of Dark fills it, the counter becomes 3 and a toast says so for 4 s", results(WITH_DARK, toast(byName("Dark"), true))],
    ["removed", "Removed — a second tap empties the bookmark, the counter goes back to 2; Undo puts the show back", results(SAVED, toast(byName("Dark"), false))],
    ["favourites", "Favourites — the button opens a drawer from the right, full width on a phone; the newest first. The bookmark of a row removes the show (the row leaves, the «removed» toast offers Undo). The backdrop, × and Escape close it", results(WITH_DARK, drawer(WITH_DARK))],
    ["favourites-empty", "Favourites, empty — nothing saved yet: the counter shows 0 and the list explains how to add a show", results([], drawer([]))],
  ];

  document.getElementById("app").innerHTML = SCREENS.map(([id, text, html], i) =>
    `<p class="caption"><b>${i + 1} · ${id}</b> — ${text}</p><div class="screen" id="${id}">${html}</div>`).join("");
</script>
</body>
</html>
