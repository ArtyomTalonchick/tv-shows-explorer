<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable variant: full-bleed background (the platform cuts the shape), the glyph of icon.svg inside the
       safe zone: a centred circle of 40% radius (204.8px). Colours: ink.950 #0E0E0F, ember.500 #FF6B35. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#0E0E0F"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <path d="M300 120 212 392" stroke="#FF6B35" stroke-width="72" stroke-linecap="round"/>
</svg>
