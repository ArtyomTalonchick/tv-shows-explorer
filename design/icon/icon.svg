<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The app icon: the slash of the tv/explorer logo in ember on the page background.
       Colours are tokens.json values: ink.950 #0E0E0F, ink.900 #1A1A1A, ember.500 #FF6B35, accent.glow.
       The glyph stays inside the maskable safe zone (a circle of 40% radius), so icon-maskable.svg reuses it. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0E0E0F"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1A1A1A" stroke-width="16"/>
  <path d="M300 120 212 392" stroke="#FF6B35" stroke-width="72" stroke-linecap="round"/>
</svg>
